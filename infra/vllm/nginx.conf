server {
    listen 80;
    client_max_body_size 256k;
    # Resolve at request time, so nginx starts before vLLM and survives restarts.
    resolver 127.0.0.11 valid=10s;
    set $upstream http://vllm:8000;

    location = /v1/chat/completions {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location = /v1/models {
        proxy_pass $upstream;
    }

    location / {
        return 404;
    }
}
