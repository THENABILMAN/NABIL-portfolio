# vLLM on one 6 GB NVIDIA GPU, behind a proxy that exposes only the chat API.
# From the repo root:
#   docker compose --env-file .env -f infra/vllm/docker-compose.yml up -d
services:
  vllm:
    image: vllm/vllm-openai:v0.11.0
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY in .env}
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3-4B-AWQ}
      - --max-model-len=6144
      - --max-num-seqs=4
      - --gpu-memory-utilization=0.85
      - --enforce-eager
    volumes:
      - hf-cache:/root/.cache/huggingface
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # vLLM's API key protects only /v1, so its other endpoints must never be
  # reachable through a tunnel.
  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8001:80"
    depends_on:
      - vllm
    restart: unless-stopped

volumes:
  hf-cache:
