id: fitman
name: FITMAN
type: project
status: active_development
claim_status: BUILT
confidence: medium
one_line: Full-stack AI fitness and nutrition coaching platform with LangGraph agents and a FastAPI backend.
problem: Personalized workout and nutrition coaching is hard to keep consistent without structured user context.
goal: Adaptive macros, workouts, logging, and an AI coach with persistent context.
nabil_contribution: >
  Portfolio materials describe Nabil as the engineer of the full-stack app (React/Vite frontend,
  FastAPI backend, Supabase, LangGraph agent state). This repository does not contain FITMAN source,
  so contribution claims are taken from portfolio documentation, not from a code audit.
architecture: >
  Client UI → FastAPI gateway → LangGraph state machine → Groq LLM → Supabase PostgreSQL.
  Source notes also describe a CoachState TypedDict covering profile, workout, nutrition,
  memory, and document context.
technologies:
  - React
  - TypeScript
  - Vite
  - Tailwind CSS
  - FastAPI
  - Python
  - Supabase
  - PostgreSQL
  - LangGraph
  - LangChain
  - Groq
data_flow: Not fully documented beyond the high-level architecture above.
decisions:
  - Stateful LangGraph agent rather than a single-turn chatbot (documented intent).
