id: resume-analyzer
name: AI Resume Analyzer & Matcher
type: project
status: completed
claim_status: BUILT
confidence: high
one_line: Compares a resume with a job description and writes a scored report.
problem: Resumes are unstructured; matching them to jobs is noisy.
goal: Score how well a resume fits a job description and suggest improvements.
nabil_contribution: Personal Streamlit app with PDF text extraction, embedding similarity and an LLM report scored
  point by point.
architecture: Streamlit app with pdfminer, all-mpnet-base-v2 embeddings and Llama 3.3 70B on Groq.
technologies:
- Python
- Streamlit
- Sentence Transformers
- Scikit-learn
- Groq
- PDF parsing
data_flow: Resume PDF and job description → text → embedding similarity → LLM report → average score
