id: bangla-voice-agent
name: End-to-End Bangla AI Voice Agent
type: project
status: experimental
claim_status: EXPERIMENTAL
confidence: medium
one_line: Bengali speech recognition and synthesis pipeline for a voice agent.
problem: Voice AI stacks are English-centric; Bangla is lower-resource.
goal: Native Bangla STT → LLM → Bangla TTS.
nabil_contribution: Explored a Bangla voice agent with local Whisper, Bengali prompt constraints and Silero speech
  synthesis. Related experiments used Deepgram and Cartesia.
architecture: LiveKit Agents with Whisper large-v2, DeepSeek through OpenRouter and Silero Indic TTS.
technologies:
- Python
- PyTorch
- LiveKit Agents
- Whisper large-v2
- DeepSeek
- Silero TTS
data_flow: Bangla audio → Whisper transcript → LLM → Bangla speech
decisions: Bengali prompts ask for short replies in Bangla.
challenges: Low-resource language performance and latency
solutions: Not documented
results: One informal Whisper timing is recorded. It is not an accuracy claim.
benchmarks:
- bangla-whisper-informal
limitations:
- No production accuracy is claimed, and fine-tuned Bengali Whisper is UNVERIFIED.
future_improvements: Not documented
