one_line: Full-stack AI fitness and nutrition coach.
problem: Personalized workout and nutrition coaching is hard to keep consistent without structured user context.
goal: Workout generation, nutrition and progress tracking, and an AI coach with persistent memory and profile context.
nabil_contribution: Built workout generation, nutrition and progress tracking, and an AI coach with persistent memory
  and profile context. The API uses token authentication, Pydantic validation and Row Level Security.
architecture: React client → FastAPI → user context from Supabase → LangChain with Groq → safety checks → Supabase
  PostgreSQL.
